<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple IoT World - Login & Registration</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandPink: '#ec4899',
            brandBlue: '#3b82f6',
          }
        }
      }
    };
  </script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
  <!-- Theme Manager (Runs early to avoid flash of wrong theme) -->
  <script src="js/theme.js"></script>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300 relative overflow-x-hidden">
  
  <!-- Glowing ambient background orbs -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-pink-500/20 dark:bg-pink-500/15 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute top-1/2 -right-40 w-96 h-96 bg-blue-500/20 dark:bg-blue-500/15 rounded-full blur-3xl animate-pulse delay-1000"></div>
  </div>

  <!-- Header Bar -->
  <header class="relative z-10 w-full px-6 py-4 flex items-center justify-between border-b border-slate-200/60 dark:border-slate-800/80 glass-panel">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-pink-blue-gradient flex items-center justify-center shadow-lg shadow-pink-500/25">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-extrabold tracking-tight text-pink-blue-gradient">Simple IoT World</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Smart Monitoring & Actuation Platform</p>
      </div>
    </div>

    <!-- Right Controls: Light/Dark Theme Toggle -->
    <div class="flex items-center space-x-3">
      <button id="themeToggleBtn" type="button" aria-label="Toggle theme" class="flex items-center space-x-2 px-3.5 py-1.5 rounded-full border border-slate-300 dark:border-slate-700 bg-white/60 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-800 text-xs font-semibold shadow-sm transition-all duration-200 cursor-pointer">
        <span id="themeIcon"></span>
        <span id="themeText" class="hidden sm:inline">Theme</span>
      </button>
    </div>
  </header>

  <!-- Main Auth Section -->
  <main class="relative z-10 flex-grow flex items-center justify-center p-4 sm:p-6 my-6">
    <div class="w-full max-w-md">
      
      <!-- Auth Card -->
      <div class="glass-panel-elevated rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        
        <!-- Header Ribbon Accent -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-pink-blue-gradient"></div>

        <!-- Title -->
        <div class="text-center mb-6">
          <div class="inline-flex p-3 rounded-2xl bg-gradient-to-tr from-pink-500/10 to-blue-500/10 dark:from-pink-500/20 dark:to-blue-500/20 mb-3 border border-pink-500/20">
            <svg class="w-8 h-8 text-pink-500 dark:text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Access Portal</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Sign in to control & monitor your ESP8266 node</p>
        </div>

        <!-- Mode Tabs: Login / Register -->
        <div class="flex border-b border-slate-200 dark:border-slate-700/60 mb-6">
          <button id="tabLogin" class="flex-1 pb-3 text-center text-sm font-bold border-b-2 border-pink-500 text-pink-600 dark:text-pink-400 transition-all cursor-pointer">
            Sign In
          </button>
          <button id="tabRegister" class="flex-1 pb-3 text-center text-sm font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-all cursor-pointer">
            Create Account
          </button>
        </div>

        <!-- Dynamic Alert Banner -->
        <div id="authAlert" class="hidden mb-5 p-3 rounded-xl border text-sm font-medium transition-all">
          <p id="authAlertMsg"></p>
        </div>

        <!-- LOGIN FORM -->
        <form id="formLogin" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5" for="loginEmail">Email Address</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
              </span>
              <input type="email" id="loginEmail" required placeholder="triveni@sbjain.edu.in"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-900/80 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500 transition-all" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5" for="loginPassword">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
              </span>
              <input type="password" id="loginPassword" required placeholder="••••••••"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-900/80 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500 transition-all" />
            </div>
          </div>

          <button type="submit" class="w-full py-3 px-4 rounded-xl text-white font-bold text-sm bg-pink-blue-gradient hover:opacity-95 shadow-lg shadow-pink-500/30 hover:shadow-pink-500/50 transform active:scale-98 transition-all cursor-pointer">
            Sign In to Dashboard
          </button>

          <!-- Demo Credentials Quick Fill -->
          <div class="pt-2 text-center">
            <button type="button" onclick="fillDemoCredentials()" class="text-xs text-pink-600 dark:text-pink-400 hover:underline inline-flex items-center space-x-1 cursor-pointer">
              <span>⚡ Auto-fill Demo Account (Triveni)</span>
            </button>
          </div>
        </form>

        <!-- REGISTRATION FORM -->
        <form id="formRegister" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5" for="regName">Full Name</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
              </span>
              <input type="text" id="regName" placeholder="Triveni"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-900/80 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500 transition-all" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5" for="regEmail">Email Address</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
              </span>
              <input type="email" id="regEmail" placeholder="your.name@example.com"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-900/80 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500 transition-all" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5" for="regPassword">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
              </span>
              <input type="password" id="regPassword" placeholder="Minimum 6 characters"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-900/80 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500 transition-all" />
            </div>
          </div>

          <button type="submit" class="w-full py-3 px-4 rounded-xl text-white font-bold text-sm bg-pink-blue-gradient hover:opacity-95 shadow-lg shadow-pink-500/30 hover:shadow-pink-500/50 transform active:scale-98 transition-all cursor-pointer">
            Create Free Account
          </button>
        </form>

      </div>
    </div>
  </main>

  <!-- Required Footer -->
  <footer class="relative z-10 w-full py-4 px-6 text-center text-xs text-slate-500 dark:text-slate-400 border-t border-slate-200/60 dark:border-slate-800/80 glass-panel">
    <p class="flex items-center justify-center flex-wrap gap-1">
      <span>Developed with Love</span>
      <span class="heart-pulse text-base inline-block">❤️</span>
      <span>by Triveni. Department of ETC, SB Jain, Nagpur</span>
    </p>
  </footer>

  <!-- Auth Script -->
  <script src="js/auth.js"></script>
</body>
</html>
